<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démo permissions - cybersécurité</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    button { padding: 12px 16px; margin: 8px 6px 8px 0; font-size: 16px; }
    video { width: 100%; max-width: 520px; background: #111; border-radius: 12px; margin-top: 12px; }
    pre { white-space: pre-wrap; background: #f3f3f3; padding: 12px; border-radius: 10px; }
    .note { font-size: 14px; opacity: .75; }
  </style>
</head>
<body>
  <h1>Démo de permissions</h1>
  <p>Cette page demande explicitement l'autorisation d'utiliser la caméra, le micro et la localisation. Les données restent dans cette page et ne sont envoyées nulle part.</p>

  <button id="cam">Autoriser caméra + micro</button>
  <button id="loc">Autoriser localisation</button>
  <button id="stop">Arrêter caméra/micro</button>

  <video id="video" autoplay playsinline muted></video>
  <pre id="status">Prêt.</pre>
  <p class="note">À utiliser uniquement sur ton propre appareil ou avec l'accord explicite de la personne qui le possède.</p>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let stream = null;

    document.getElementById('cam').onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = stream;
        status.textContent = "Caméra et micro autorisés. Rien n'est enregistré ni envoyé.";
      } catch (e) {
        status.textContent = "Accès refusé ou indisponible : " + e.message;
      }
    };

    document.getElementById('loc').onclick = () => {
      if (!navigator.geolocation) {
        status.textContent = "La géolocalisation n'est pas disponible.";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          status.textContent =
            "Localisation autorisée :\nLatitude : " + pos.coords.latitude +
            "\nLongitude : " + pos.coords.longitude +
            "\nPrécision : ±" + Math.round(pos.coords.accuracy) + " m\n\nCes coordonnées ne sont envoyées nulle part.";
        },
        (err) => {
          status.textContent = "Accès à la localisation refusé ou indisponible : " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    };

    document.getElementById('stop').onclick = () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
        status.textContent = "Caméra et micro arrêtés.";
      }
    };
  </script>
</body>
</html>
